name: Recover YWD-Plug source baseline

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/recover-source.yml'
      - 'recovery/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout YWD-Plug dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Recover pinned upstream source
        shell: bash
        run: bash ./recovery/tools/recover_source.sh "$GITHUB_WORKSPACE"

      - name: Commit recovered source
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "No recovery changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: recover maintainable YWD-Plug source baseline"
          git push origin HEAD:dev
